[supervisord]
nodaemon=true
user=root
logfile=/home/firefox/supervisord.log
pidfile=/home/firefox/supervisord.pid


[program:xvfb]
user=root
command=/bin/bash -c "rm -rf /tmp/.X0-lock /tmp/.X11-unix/X0 \
    && mkdir -p /tmp/.X11-unix \
    && chmod 1777 /tmp/.X11-unix \
    && Xvfb :0 -screen 0 ${DISPLAY_WIDTH:-1920}x${DISPLAY_HEIGHT:-1080}x${DISPLAY_DEPTH:-24} -ac"
environment=DISPLAY=":0"
autorestart=true
priority=10


[program:openbox]
user=firefox
command=openbox-session
environment=DISPLAY=":0",HOME="/home/firefox"
autorestart=true
priority=20


[program:vnc]
user=root
command=/bin/bash -c "sleep 3 && x11vnc -display :0 -forever -shared -rfbport 5900 -nopw"
environment=DISPLAY=:0
autorestart=true
priority=30


[program:novnc]
user=firefox
command=websockify --web=/usr/share/novnc/ 3000 localhost:5900
autorestart=true
priority=40


[program:firefox]
user=firefox
command=/bin/bash -c \
    "until xdpyinfo -display :0 >/dev/null 2>&1; do sleep 1; done; \
    PROFILE_DIR=\"/config/profile/default\"; \
    mkdir -p \"$PROFILE_DIR\"; \
    USER_JS=\"$PROFILE_DIR/user.js\"; \
    if [ -n \"$FIREFOX_PROXY\" ]; then \
      PROXY_TYPE=1; \
      if [[ \"$FIREFOX_PROXY\" == socks5* ]]; then PROXY_TYPE=5; fi; \
      CLEAN_PROXY=$(echo \"$FIREFOX_PROXY\" | sed -E 's|^(http://\|socks5://)||'); \
      PROXY_HOST=$(echo \"$CLEAN_PROXY\" | cut -d':' -f1); \
      PROXY_PORT=$(echo \"$CLEAN_PROXY\" | cut -d':' -f2); \
      echo \"user_pref('network.proxy.type', 1);\" > \"$USER_JS\"; \
      if [ \"$PROXY_TYPE\" -eq 5 ]; then \
        echo \"user_pref('network.proxy.socks', '$PROXY_HOST');\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.socks_port', ${PROXY_PORT:-1080});\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.socks_version', 5);\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.socks_remote_dns', true);\" >> \"$USER_JS\"; \
      else \
        echo \"user_pref('network.proxy.http', '$PROXY_HOST');\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.http_port', ${PROXY_PORT:-8080});\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.ssl', '$PROXY_HOST');\" >> \"$USER_JS\"; \
        echo \"user_pref('network.proxy.ssl_port', ${PROXY_PORT:-8080});\" >> \"$USER_JS\"; \
      fi; \      
    else \
      echo \"user_pref('network.proxy.type', 0);\" > \"$USER_JS\"; \
    fi; \
    firefox --no-remote --profile \"$PROFILE_DIR\""
environment=DISPLAY=":0",HOME="/home/firefox"
autorestart=true
priority=50
